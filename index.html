<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlueJay Beta Update</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f4c75, #3282b8);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      background: rgba(0, 0, 0, 0.45);
      padding: 3rem;
      border-radius: 16px;
      max-width: 650px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #ffd369;
    }
    p {
      line-height: 1.6;
      margin: 0.75rem 0;
      font-size: 1.1rem;
    }
    .highlight {
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BlueJay Beta Program Update</h1>
    <p>The <span class="highlight">BlueJay Beta testing program</span> has now come to a close.</p>
    <p>Our team is taking a pause while we evaluate the results and determine the next phase of development.</p>
    <p>We thank everyone and extend our gratitude to our beta testers for their time and feedback.</p>
  </div>
</body>
</html>
